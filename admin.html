<!DOCTYPE html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Maire Rästa</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>" />

    <style>
:root {
  color-scheme: light;
  --bg: #fcf7f1;
  --surface: #ffffff;
  --surface-alt: #f4e8dc;
  --text: #2f241d;
  --muted: #785e4f;
  --accent: #c56f3f;
  --accent-dark: #924d24;
  --border: #eadccb;
  --shadow: 0 18px 40px rgba(47, 36, 29, 0.08);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  color: var(--text);
  background: linear-gradient(135deg, var(--bg), #fdfaf4);
  line-height: 1.6;
}

img {
  max-width: 100%;
  display: block;
}

.container {
  width: min(1120px, calc(100% - 2rem));
  margin: 0 auto;
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(252, 247, 241, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 0;
}

.brand {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--accent-dark);
  text-decoration: none;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.brand-logo {
  height: 40px;
  width: auto;
  display: block;
}

.main-nav {
  display: flex;
  gap: 1rem;
}

.main-nav a {
  text-decoration: none;
  color: var(--text);
  font-weight: 600;
}

.hero {
  padding: 4rem 0 3rem;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.3fr 0.9fr;
  gap: 2rem;
  align-items: center;
}

.hero h1 {
  font-size: clamp(2rem, 4vw, 3.2rem);
  margin: 0.3rem 0 1rem;
}

.hero-copy {
  font-size: 1.05rem;
  color: var(--muted);
  max-width: 60ch;
}

.eyebrow {
  margin: 0;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-size: 0.82rem;
  font-weight: 700;
}

.hero-card,
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: var(--shadow);
}

.hero-card {
  padding: 1.5rem;
}

.button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  border: none;
  border-radius: 999px;
  padding: 0.8rem 1.2rem;
  cursor: pointer;
  font-weight: 700;
  text-decoration: none;
}

.button.primary {
  background: var(--accent);
  color: #fff;
}

.button.secondary {
  background: var(--surface-alt);
  color: var(--accent-dark);
}

.section-space {
  padding: 2rem 0 4rem;
}

.section-title {
  margin-bottom: 1.25rem;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.25rem;
}

.product-card {
  padding: 1.2rem;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.product-card h3 {
  margin: 0.2rem 0 0.4rem;
}

.product-image {
  width: 100%;
  height: auto;
  max-height: 320px;
  object-fit: contain;
  border-radius: 14px;
  margin-bottom: 0.8rem;
  background: #f8f1e9;
}

.image-preview {
  display: none;
  width: 100%;
  height: auto;
  max-height: 320px;
  object-fit: contain;
  border-radius: 14px;
  margin-top: 0.4rem;
  border: 1px solid var(--border);
  background: #f8f1e9;
}

.image-actions {
  margin-top: -0.2rem;
  margin-bottom: 0.5rem;
}

.price {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent-dark);
}

.cart-layout {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 1.25rem;
}

.cart-items {
  display: grid;
  gap: 1rem;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  padding: 1rem;
  border-radius: 18px;
  background: var(--surface);
  border: 1px solid var(--border);
}

.checkout-card {
  padding: 1.25rem;
  border-radius: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}

label {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  margin-bottom: 0.8rem;
  font-weight: 600;
}

input,
textarea {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.7rem 0.85rem;
  font: inherit;
  background: #fff;
}

.status-text {
  min-height: 1.2rem;
  color: var(--accent-dark);
  font-weight: 600;
}

.site-footer {
  padding: 1.5rem 0 2rem;
  color: var(--muted);
}

.footer-row {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid var(--border);
  padding-top: 1rem;
}

.admin-layout {
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  gap: 1.25rem;
}

.admin-stack {
  display: grid;
  gap: 1.25rem;
}

.lock-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.lock-card {
  width: min(420px, 100%);
  padding: 2rem;
  border-radius: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}

.hidden {
  display: none !important;
}

.form-card,
.table-card {
  padding: 1.25rem;
}

.button-row {
  display: flex;
  gap: 0.75rem;
  margin-top: 0.5rem;
}

.admin-list {
  display: grid;
  gap: 0.8rem;
}

.admin-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  padding: 0.85rem 0.95rem;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #fffdf9;
}

.admin-item strong {
  display: block;
}

.order-status {
  display: inline-block;
  margin-top: 0.35rem;
  padding: 0.18rem 0.55rem;
  border-radius: 999px;
  background: var(--surface-alt);
  color: var(--accent-dark);
  font-size: 0.8rem;
  font-weight: 700;
}

.small-actions {
  display: flex;
  gap: 0.5rem;
}

.cart-actions {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.cart-remove {
  padding: 0.45rem 0.75rem;
  font-size: 0.9rem;
}

@media (max-width: 840px) {
  .hero-grid,
  .cart-layout,
  .admin-layout {
    grid-template-columns: 1fr;
  }
}
    </style>
    <script>
      // Render backend URL
      window.API_URL = 'https://www.maireart.eu';
    </script>
  </head>
  <body>
    <div id="admin-lock" class="lock-screen">
      <div class="lock-card">
        <p class="eyebrow">Ligipääs</p>
        <h1>Administreerimisala</h1>
        <p>Sisesta salasõna, et jätkata.</p>
        <label>
          Salasõna
          <input type="password" id="admin-password" />
        </label>
        <button class="button primary" id="unlock-admin" type="button">Ava</button>
        <p id="unlock-error" class="status-text"></p>
      </div>
    </div>

    <div id="admin-page" class="admin-page hidden">
      <header class="site-header">
        <div class="container nav-bar">
          <a href="index.html" class="brand">
            <img src="img/mrlogo.png" alt="Maire Rästa" class="brand-logo" />
          </a>
          <nav class="main-nav">
            <a href="index.html">Pood</a>
            <a href="admin.html">Admin</a>
          </nav>
        </div>
      </header>

      <main class="container section-space">
        <div class="section-title">
          <p class="eyebrow">Halda kaupu</p>
          <h1>Administreerimine</h1>
        </div>

        <div class="admin-layout">
          <form id="product-form" class="card form-card">
            <h2>Lisa või muuda toodet</h2>
            <input type="hidden" id="product-id" />
            <label>
              Nimi
              <input type="text" id="product-name" required />
            </label>
            <label>
              Kirjeldus
              <textarea id="product-description" rows="3" required></textarea>
            </label>
            <label>
              Hind (€)
              <input type="number" id="product-price" step="0.01" min="0" required />
            </label>
            <label>
              Laoseis
              <input type="number" id="product-stock" min="0" required />
            </label>
            <label>
              Kategooria
              <input type="text" id="product-category" required />
            </label>
            <label>
              Pilt (valikuline)
              <input type="file" id="product-image" accept="image/*" />
            </label>
            <div class="button-row image-actions">
              <button class="button secondary" type="button" id="replace-image">Asenda pilt</button>
              <button class="button secondary" type="button" id="remove-image">Eemalda pilt</button>
            </div>
            <img id="product-image-preview" class="image-preview" alt="Pildi eelvaade" />
            <div class="button-row">
              <button class="button primary" type="submit">Salvesta</button>
              <button class="button secondary" type="button" id="cancel-edit">Tühista</button>
            </div>
          </form>

          <div class="admin-stack">
            <div class="card table-card">
              <h2>Tooted</h2>
              <div id="product-list" class="admin-list"></div>
            </div>

            <div class="card table-card">
              <h2>Tellimused</h2>
              <div id="order-list" class="admin-list"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
const PRODUCTS_KEY = 'mairepood.products';
const ORDERS_KEY = 'mairepood.orders';
const ACCESS_KEY = 'mairepood.adminAccess';
const productForm = document.getElementById('product-form');
const productList = document.getElementById('product-list');
const orderList = document.getElementById('order-list');
const cancelEditButton = document.getElementById('cancel-edit');
const hiddenId = document.getElementById('product-id');
const imageInput = document.getElementById('product-image');
const imagePreview = document.getElementById('product-image-preview');
const replaceImageButton = document.getElementById('replace-image');
const removeImageButton = document.getElementById('remove-image');
const adminLock = document.getElementById('admin-lock');
const adminPage = document.getElementById('admin-page');
const passwordInput = document.getElementById('admin-password');
const unlockButton = document.getElementById('unlock-admin');
const unlockError = document.getElementById('unlock-error');

let editingProductId = null;
let selectedImageData = null;

const API_BASE = (() => {
  if (typeof window !== 'undefined') {
    const hostname = window.location.hostname;
    const protocol = window.location.protocol;
    
    if (hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '[::1]') {
      return 'http://localhost:10000';
    }
    
    if (protocol === 'file:') {
      return 'http://localhost:10000';
    }
    
    if (typeof window.API_URL === 'string' && window.API_URL.trim()) {
      return window.API_URL.replace(/\/$/, '');
    }

    if (protocol === 'http:' || protocol === 'https:') {
      return '';
    }
  }

  return 'http://localhost:10000';
})();

console.log('Admin API_BASE:', API_BASE);

function loadProducts() {
  return JSON.parse(localStorage.getItem(PRODUCTS_KEY) || '[]');
}

function saveProducts(products) {
  localStorage.setItem(PRODUCTS_KEY, JSON.stringify(products));
}

async function fetchProductsFromBackend() {
  try {
    if (API_BASE) {
      const response = await fetch(`${API_BASE}/api/products?_=${new Date().getTime()}`, {
        headers: {
          'Cache-Control': 'no-cache',
          'Pragma': 'no-cache'
        }
      });
      if (!response.ok) {
        throw new Error('Failed to load products from backend');
      }
      const products = await response.json();
      localStorage.setItem(PRODUCTS_KEY, JSON.stringify(products));
      return products;
    }
  } catch (error) {
    console.warn('Could not fetch products from backend:', error);
  }

  return loadProducts();
}

async function fetchOrdersFromBackend() {
  console.log('fetchOrdersFromBackend called, API_BASE:', API_BASE);
  try {
    if (API_BASE) {
      const url = `${API_BASE}/api/orders?_=${new Date().getTime()}`;
      console.log('Fetching orders from:', url);
      const response = await fetch(url, {
        headers: {
          'Cache-Control': 'no-cache',
          'Pragma': 'no-cache'
        }
      });
      console.log('Orders response status:', response.status, 'ok:', response.ok);
      if (!response.ok) {
        throw new Error('Failed to load orders from backend');
      }
      const orders = await response.json();
      console.log('Orders fetched:', orders);
      localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
      return orders;
    }
  } catch (error) {
    console.warn('Could not fetch orders from backend:', error);
  }

  const localOrders = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');
  console.log('Using local orders:', localOrders);
  return localOrders;
}

async function saveOrderToBackend(order) {
  if (!API_BASE) return false;
  
  try {
    const response = await fetch(`${API_BASE}/api/orders`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(order)
    });
    
    if (!response.ok) {
      throw new Error('Failed to save order to backend');
    }
    
    return true;
  } catch (error) {
    console.error('Failed to save order to backend:', error);
    return false;
  }
}

async function updateOrderStatusInBackend(orderId, newStatus) {
  if (!API_BASE) return false;
  
  try {
    const response = await fetch(`${API_BASE}/api/orders/${orderId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: newStatus })
    });
    
    return response.ok;
  } catch (error) {
    console.error('Failed to update order status:', error);
    return false;
  }
}

async function deleteOrderFromBackend(orderId) {
  console.log('deleteOrderFromBackend called, API_BASE:', API_BASE, 'orderId:', orderId);
  if (!API_BASE) {
    console.log('No API_BASE, cannot delete from backend');
    return false;
  }
  
  try {
    const url = `${API_BASE}/api/orders/${orderId}`;
    console.log('Delete order URL:', url);
    
    const response = await fetch(url, {
      method: 'DELETE'
    });
    
    console.log('Delete order response status:', response.status);
    console.log('Delete order response ok:', response.ok);
    
    if (!response.ok) {
      const errorText = await response.text();
      console.error('Delete order error response:', errorText);
    }
    
    return response.ok;
  } catch (error) {
    console.error('Failed to delete order:', error);
    return false;
  }
}

function renderProducts() {
  const products = loadProducts();
  productList.innerHTML = '';

  if (!products.length) {
    productList.innerHTML = '<p>Ühtegi toodet pole veel lisatud.</p>';
    return;
  }

  const fragment = document.createDocumentFragment();
  products.forEach((product) => {
    const row = document.createElement('div');
    row.className = 'admin-item';
    row.innerHTML = `
      <div>
        <strong>${product.name}</strong>
        <div>${product.category} • ${product.stock} tk • €${product.price}</div>
      </div>
      <div class="small-actions">
        <button class="button secondary" type="button" data-action="edit" data-id="${product.id}">Muuda</button>
        <button class="button primary" type="button" data-action="delete" data-id="${product.id}">Kustuta</button>
      </div>
    `;
    fragment.appendChild(row);
  });

  productList.appendChild(fragment);
}

async function renderOrders() {
  let orders = [];
  
  if (API_BASE) {
    orders = await fetchOrdersFromBackend();
  } else {
    orders = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');
  }
  
  orderList.innerHTML = '';

  if (!orders.length) {
    orderList.innerHTML = '<p>Ühtegi tellimust pole veel saabunud.</p>';
    return;
  }

  const fragment = document.createDocumentFragment();
  orders.slice().reverse().forEach((order) => {
    const row = document.createElement('div');
    row.className = 'admin-item';
    const itemsText = order.items.map((item) => `${item.name} × ${item.quantity}`).join(', ');
    const statusLabel = order.status === 'processed' ? 'Töödeldud' : 'Ootel';
    
    console.log('Rendering order:', order);
    console.log('Order ID:', order.id);
    
    row.innerHTML = `
      <div>
        <strong>${order.name}</strong>
        <div>${order.email}</div>
        <div>${itemsText}</div>
        <div>${order.message || '—'}</div>
        <div>${new Date(order.createdAt).toLocaleString('et-EE')}</div>
        <span class="order-status">${statusLabel}</span>
      </div>
      <div class="small-actions">
        <button class="button secondary" type="button" data-action="toggle-order" data-id="${order.id}">
          ${order.status === 'processed' ? 'Sea ootele' : 'Märgi töödelduks'}
        </button>
        <button class="button primary" type="button" data-action="delete-order" data-id="${order.id}">Kustuta</button>
      </div>
    `;
    fragment.appendChild(row);
  });

  orderList.appendChild(fragment);
}

function resetForm() {
  productForm.reset();
  hiddenId.value = '';
  editingProductId = null;
  selectedImageData = null;
  imagePreview.style.display = 'none';
  imagePreview.src = '';
}

function showAdminArea() {
  adminLock?.classList.add('hidden');
  adminPage?.classList.remove('hidden');
}

function showLockScreen() {
  adminLock?.classList.remove('hidden');
  adminPage?.classList.add('hidden');
}

async function unlockAdmin() {
  console.log('=== Admin Login Debug ===');
  console.log('API_BASE:', API_BASE);
  console.log('Password:', passwordInput?.value || '');
  console.log('Window location:', window.location.href);
  console.log('Window hostname:', window.location.hostname);
  console.log('Window protocol:', window.location.protocol);
  console.log('Window origin:', window.location.origin);
  
  try {
    const url = API_BASE ? `${API_BASE}/api/Auth/login` : '/api/Auth/login';
    console.log('Auth URL:', url);
    console.log('Full URL:', new URL(url, window.location.href).href);
    
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: passwordInput?.value || '' })
    });
    
    console.log('Auth response status:', response.status);
    console.log('Auth response ok:', response.ok);
    console.log('Auth response headers:', Object.fromEntries(response.headers.entries()));
    
    const responseText = await response.text();
    console.log('Auth response text:', responseText);
    console.log('Auth response text length:', responseText.length);
    console.log('Auth response text starts with:', responseText.substring(0, 100));
    console.log('Content-Type:', response.headers.get('Content-Type'));
    
    const contentType = response.headers.get('Content-Type');
    if (!contentType || !contentType.includes('application/json')) {
      throw new Error(`Server returned non-JSON response (Content-Type: ${contentType}). Response: ${responseText.substring(0, 200)}`);
    }
    
    const result = JSON.parse(responseText);
    console.log('Auth response parsed:', result);
    
    if (result.success) {
      sessionStorage.setItem(ACCESS_KEY, 'true');
      showAdminArea();
      await fetchProductsFromBackend();
      await fetchOrdersFromBackend();
      renderProducts();
      await renderOrders();
      passwordInput.value = '';
      return;
    }

    alert('Vale parool!');
  } catch (error) {
    console.error('Login error:', error);
    console.error('Error message:', error.message);
    console.error('Error stack:', error.stack);
    console.error('Error name:', error.name);
    alert('Viga sisselogimisel: ' + error.message);
  }

  passwordInput.value = '';
  passwordInput.focus();
}

function fillForm(product) {
  hiddenId.value = product.id;
  document.getElementById('product-name').value = product.name;
  document.getElementById('product-description').value = product.description;
  document.getElementById('product-price').value = product.price;
  document.getElementById('product-stock').value = product.stock;
  document.getElementById('product-category').value = product.category;
  editingProductId = product.id;
  selectedImageData = product.image || null;
  if (selectedImageData) {
    imagePreview.src = selectedImageData;
    imagePreview.style.display = 'block';
  } else {
    imagePreview.style.display = 'none';
    imagePreview.src = '';
  }
}

function resizeImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxWidth = 800;
        const scale = Math.min(1, maxWidth / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleImageSelection(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) {
    selectedImageData = null;
    imagePreview.style.display = 'none';
    imagePreview.src = '';
    return;
  }

  selectedImageData = await resizeImage(file);
  imagePreview.src = selectedImageData;
  imagePreview.style.display = 'block';
}

function removeSelectedImage() {
  selectedImageData = null;
  imagePreview.style.display = 'none';
  imagePreview.src = '';
  imageInput.value = '';
}

productForm.addEventListener('submit', async (event) => {
  event.preventDefault();

  const id = hiddenId.value || crypto.randomUUID();
  const productData = {
    id: id,
    name: document.getElementById('product-name').value.trim(),
    description: document.getElementById('product-description').value.trim(),
    price: parseFloat(document.getElementById('product-price').value) || 0,
    stock: parseInt(document.getElementById('product-stock').value, 10) || 0,
    category: document.getElementById('product-category').value,
    image: selectedImageData
  };

  try {
    if (API_BASE) {
      const url = editingProductId ? `${API_BASE}/api/products/${id}` : `${API_BASE}/api/products`;
      const method = editingProductId ? 'PUT' : 'POST';

      const response = await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(productData)
      });

      if (!response.ok) throw new Error('Toote salvestamine backendis ebaõnnestus');
    }

    let products = loadProducts();
    if (editingProductId) {
      products = products.map(p => p.id === editingProductId ? productData : p);
    } else {
      products.push(productData);
    }
    saveProducts(products);
    renderProducts();
    resetForm();
    alert('Toode on edukalt salvestatud!');
  } catch (error) {
    console.error('Viga salvestamisel:', error);
    alert('Viga: Toote salvestamine ebaõnnestus.');
  }
});

productList.addEventListener('click', async (event) => {
  const target = event.target;
  const action = target.getAttribute('data-action');
  const id = target.getAttribute('data-id');
  if (!action || !id) return;

  const products = loadProducts();

  if (action === 'edit') {
    const product = products.find(p => p.id === id);
    if (product) fillForm(product);
  } else if (action === 'delete') {
    if (!confirm('Kas oled kindel, et soovid selle toote kustutada?')) return;

    try {
      if (API_BASE) {
        const response = await fetch(`${API_BASE}/api/products/${id}`, { method: 'DELETE' });
        if (!response.ok) throw new Error('Kustutamine backendis ebaõnnestus');
      }

      const updatedProducts = products.filter(p => p.id !== id);
      saveProducts(updatedProducts);
      renderProducts();
      if (editingProductId === id) resetForm();
    } catch (error) {
      console.error('Viga kustutamisel:', error);
      alert('Viga: Toote kustutamine ebaõnnestus.');
    }
  }
});

orderList.addEventListener('click', async (event) => {
  const target = event.target;
  const action = target.getAttribute('data-action');
  const id = target.getAttribute('data-id');
  if (!action || !id) return;

  if (action === 'toggle-order') {
    try {
      let orders = [];
      if (API_BASE) {
        const response = await fetch(`${API_BASE}/api/orders`);
        orders = await response.json();
      } else {
        orders = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');
      }
      
      const order = orders.find(o => o.id === id);
      if (!order) {
        alert('Tellimust ei leitud');
        return;
      }
      
      const newStatus = order.status === 'processed' ? 'pending' : 'processed';
      
      if (API_BASE) {
        const success = await updateOrderStatusInBackend(id, newStatus);
        if (!success) throw new Error('Staatuse uuendamine ebaõnnestus');
      } else {
        order.status = newStatus;
        localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
      }
      
      await renderOrders();
    } catch (error) {
      console.error('Viga staatuse muutmisel:', error);
      alert('Viga: Tellimuse staatust ei saanud muuta.');
    }
  } else if (action === 'delete-order') {
    if (!confirm('Kas oled kindel, et soovid selle tellimuse ajaloost kustutada?')) return;

    try {
      if (API_BASE) {
        const success = await deleteOrderFromBackend(id);
        if (!success) throw new Error('Kustutamine ebaõnnestus');
      } else {
        let orders = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');
        orders = orders.filter(o => o.id !== id);
        localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
      }
      
      await renderOrders();
    } catch (error) {
      console.error('Viga tellimuse kustutamisel:', error);
      alert('Viga: Tellimust ei saanud kustutada.');
    }
  }
});

cancelEditButton.addEventListener('click', resetForm);
imageInput.addEventListener('change', handleImageSelection);
removeImageButton.addEventListener('click', removeSelectedImage);
replaceImageButton.addEventListener('click', () => imageInput.click());
unlockButton.addEventListener('click', unlockAdmin);
passwordInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') unlockAdmin();
});

(() => {
  if (sessionStorage.getItem(ACCESS_KEY) === 'true') {
    showAdminArea();
    Promise.all([fetchProductsFromBackend(), fetchOrdersFromBackend()]).then(() => {
      renderProducts();
      renderOrders();
    });
  } else {
    showLockScreen();
  }
})();
    </script>
  </body>
</html>
